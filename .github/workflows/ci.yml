name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Classify every push/PR before launching heavy builds.
  # Docs/examples-only changes skip Rust/multi-OS compilation and run the fast
  # Docs Drift Check; anything touching code/config runs lint + full 3.14t/3.15t CI.
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository (full history for push diffs)
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Omit `base` so PRs use the GitHub API diff and pushes to `main`
          # automatically compare against the pre-push commit range (`before`).
          # `some-with-excludes` is required for `!` negations to apply.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'examples/**'
              - 'tests/test_docs.py'
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!examples/**'

  docs:
    name: Docs Drift Check
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.14t"
          install-rust: "false"
          sync-mode: "no-project"
          uv-cache: "true"

      - name: Lint & format check docs/examples Python files
        run: |
          uv run --no-sync ruff check tests/test_docs.py examples
          uv run --no-sync ruff format --check tests/test_docs.py examples

      - name: Run docs parity & syntax guard
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest tests/test_docs.py -q

  lint:
    name: Lint & Static Analysis
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.14t"
          rust-components: "clippy, rustfmt"
          sync-mode: "no-project"
          cache-key: "lint"
          uv-cache: "true"

      - uses: ./.github/actions/run-lint

  test:
    name: Build & Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: [changes, lint]
    if: (needs.changes.outputs.code == 'true' && success()) || needs.changes.result != 'success'
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14t"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            python-version: "3.15t"
            experimental: true
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}
          sync-mode: "no-project"
          cache-key: ${{ matrix.os }}-${{ matrix.python-version }}
          uv-cache: "true"

      - name: Build Rust Extension
        run: uv run --no-sync maturin develop --release --locked

      - name: Run Rust Unit Tests
        run: uv run --no-sync python .github/scripts/run_rust_tests.py

      - name: Run Python Test Suite & Race Checks
        run: uv run --no-sync pytest

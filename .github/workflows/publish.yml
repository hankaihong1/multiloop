name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish destination (pypi, testpypi, or dry-run build/test only)"
        type: choice
        default: "pypi"
        options:
          - pypi
          - testpypi
          - dry-run

permissions:
  contents: read

jobs:
  # Pre-flight gate: verify version parity, CHANGELOG, lint/type/clippy/doc checks,
  # and sdist metadata before spinning up multi-OS wheel runners.
  validate:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.14t"
          rust-components: "clippy, rustfmt"
          sync-mode: "no-project"
          cache-key: "validate"

      - name: Check tag & CHANGELOG parity
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            uv run --no-sync python .github/scripts/check_release.py --tag "${GITHUB_REF_NAME}" --require-changelog
          else
            uv run --no-sync python .github/scripts/check_release.py --require-changelog
          fi

      - uses: ./.github/actions/run-lint

  # Free-threaded cp314t wheels across Linux, macOS, and Windows.
  build_wheels:
    name: Build wheels (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2_17"
            setup_python: "false"
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64
            manylinux: "2_17"
            setup_python: "false"
          - name: macos-x86_64
            os: macos-latest
            target: x86_64
            manylinux: "auto"
            setup_python: "true"
          - name: macos-aarch64
            os: macos-latest
            target: aarch64
            manylinux: "auto"
            setup_python: "true"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64
            manylinux: "auto"
            setup_python: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14t (macOS)
        if: ${{ matrix.setup_python == 'true' && matrix.os == 'macos-latest' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.14t"

      - name: Set up Python 3.14t (Windows)
        if: ${{ matrix.setup_python == 'true' && matrix.os == 'windows-latest' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: auto

      - uses: ./.github/actions/build-dist
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --interpreter 3.14t --compatibility pypi
          artifact-name: dist-wheels-${{ matrix.name }}

  sdist:
    name: Build source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: auto

      - uses: ./.github/actions/build-dist
        with:
          command: sdist
          args: --out dist
          artifact-name: dist-sdist

  # Install built wheels strictly from dist/ (--no-index, --only-binary, --no-sync)
  # and verify site-packages origin + disabled GIL before running pytest.
  test_wheels:
    name: Test wheel on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    needs: build_wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14t"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}
          install-rust: "false"
          sync-mode: "no-project"

      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: dist-wheels-*
          merge-multiple: true
          path: dist

      - name: Install wheel (no index)
        run: |
          uv pip install multiloop --no-index --no-deps --only-binary :all: --find-links dist --reinstall

      - name: Smoke test wheel (site-packages & no-GIL)
        run: |
          uv run --no-sync python -c "import sys, multiloop, multiloop._multiloop_core as m; assert 'site-packages' in multiloop.__file__; assert 'site-packages' in m.__file__; assert hasattr(sys, '_is_gil_enabled') and not sys._is_gil_enabled(); print('ok:', m.__file__)"

      - name: Run test suite against installed wheel
        run: uv run --no-sync pytest -m "not slow"

  # Build and install directly from the packaged sdist tarball to prove every
  # source file, lockfile, and doc asset required for building is included.
  test_sdist:
    name: Test sdist build & install (ubuntu-latest, Python 3.14t)
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.14t"
          sync-mode: "no-project"
          cache-key: "sdist-test"

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: dist-sdist
          path: dist

      - name: Build & install from sdist
        run: uv pip install --no-index --no-build-isolation --no-deps --reinstall dist/*.tar.gz

      - name: Smoke test sdist install (site-packages & no-GIL)
        run: |
          uv run --no-sync python -c "import sys, multiloop, multiloop._multiloop_core as m; assert 'site-packages' in multiloop.__file__; assert 'site-packages' in m.__file__; assert hasattr(sys, '_is_gil_enabled') and not sys._is_gil_enabled(); print('ok:', m.__file__)"

      - name: Run test suite against sdist install
        run: uv run --no-sync pytest -m "not slow"

  publish:
    name: Publish to PyPI
    needs: [validate, test_wheels, test_sdist]
    if: ${{ inputs.target != 'dry-run' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target == 'testpypi' && 'testpypi' || 'pypi' }}
      url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/p/multiloop' || 'https://pypi.org/p/multiloop' }}
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: auto

      - name: Download all distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Verify release metadata parity
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            uv run --no-sync python .github/scripts/check_release.py --tag "${GITHUB_REF_NAME}" --require-changelog
          else
            uv run --no-sync python .github/scripts/check_release.py --require-changelog
          fi

      - name: Verify archive integrity (zip & tar)
        shell: bash
        run: |
          for whl in dist/*.whl; do unzip -qt "$whl"; done
          for sdist in dist/*.tar.gz; do tar -tzf "$sdist" > /dev/null; done

      - name: Publish package to PyPI
        if: ${{ inputs.target != 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish package to TestPyPI
        if: ${{ inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish destination (pypi, testpypi, or dry-run build/test only)"
        type: choice
        default: "pypi"
        options:
          - pypi
          - testpypi
          - dry-run

permissions:
  contents: read

env:
  # Space-separated free-threaded Python versions built & tested per OS runner.
  PYTHON_VERSIONS: "3.14t 3.15t"
  MATURIN_VERSION: "v1.14.1"

jobs:
  # Pre-flight gate: verify version parity, CHANGELOG, lint/type/clippy/doc checks,
  # and sdist metadata before spinning up multi-OS wheel runners.
  validate:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.14t"
          rust-components: "clippy, rustfmt"
          sync-mode: "no-project"
          cache-key: "validate"

      - name: Check tag & CHANGELOG parity
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            uv run --no-sync python .github/scripts/check_release.py --tag "${GITHUB_REF_NAME}" --require-changelog
          else
            uv run --no-sync python .github/scripts/check_release.py --require-changelog
          fi

      - uses: ./.github/actions/run-lint

  # Build all target free-threaded wheels grouped by OS / architecture runner.
  build_wheels:
    name: Build wheels (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            mode: container-wheels
            manylinux: "2_28"
            target: ""
            rust_target: ""
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            mode: container-wheels
            manylinux: "2_28"
            target: ""
            rust_target: ""
          - name: macos-x86_64
            os: macos-latest
            mode: host-wheels
            manylinux: "auto"
            target: x86_64
            rust_target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-latest
            mode: host-wheels
            manylinux: "auto"
            target: aarch64
            rust_target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            mode: host-wheels
            manylinux: "auto"
            target: x86_64
            rust_target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: auto

      - uses: ./.github/actions/build-dist
        with:
          mode: ${{ matrix.mode }}
          target: ${{ matrix.target }}
          rust-target: ${{ matrix.rust_target }}
          manylinux: ${{ matrix.manylinux }}
          python-versions: ${{ env.PYTHON_VERSIONS }}
          cache-key: ${{ matrix.name }}
          artifact-name: dist-wheels-${{ matrix.name }}
          maturin-version: ${{ env.MATURIN_VERSION }}

  sdist:
    name: Build source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: auto

      - uses: ./.github/actions/build-dist
        with:
          mode: sdist
          artifact-name: dist-sdist
          maturin-version: ${{ env.MATURIN_VERSION }}

  # Verify all built wheels per OS/arch runner across every free-threaded version.
  test_wheels:
    name: Test wheels (${{ matrix.os }})
    needs: build_wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.14t"
          install-rust: "false"
          sync-mode: "none"

      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: dist-wheels-*
          merge-multiple: true
          path: dist

      - name: Verify all free-threaded wheels on ${{ matrix.os }}
        run: uv run --no-project python .github/scripts/verify_dist.py --mode wheels

  # Build and install from the packaged sdist across every free-threaded version.
  test_sdist:
    name: Test sdist build & install (ubuntu-latest)
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.14t"
          sync-mode: "none"
          cache-key: "sdist-test"

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: dist-sdist
          path: dist

      - name: Verify sdist build & tests across free-threaded versions
        run: uv run --no-project python .github/scripts/verify_dist.py --mode sdist

  publish:
    name: Publish to PyPI
    needs: [validate, test_wheels, test_sdist]
    if: ${{ inputs.target != 'dry-run' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target == 'testpypi' && 'testpypi' || 'pypi' }}
      url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/p/multiloop' || 'https://pypi.org/p/multiloop' }}
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: auto

      - name: Download all distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Verify release metadata parity
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            uv run --no-sync python .github/scripts/check_release.py --tag "${GITHUB_REF_NAME}" --require-changelog
          else
            uv run --no-sync python .github/scripts/check_release.py --require-changelog
          fi

      - name: Verify archive integrity (zip & tar)
        shell: bash
        run: |
          for whl in dist/*.whl; do unzip -qt "$whl"; done
          for sdist in dist/*.tar.gz; do tar -tzf "$sdist" > /dev/null; done

      - name: Publish package to PyPI
        if: ${{ inputs.target != 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish package to TestPyPI
        if: ${{ inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
